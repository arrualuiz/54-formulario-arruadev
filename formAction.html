    <div class="container">

        const params = new URLSearchParams(window.location.search);

        document.getElementById("resultado").innerHTML = `
            <p><strong>Nome:</strong> ${params.get("nome")}</p>
            <p><strong>Email:</strong> ${params.get("email")}</p>
            <p><strong>Idade:</strong> ${params.get("idade")}</p>
            <p><strong>Telefone:</strong> ${params.get("telefone")}</p>
        `;
    </script>
