<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <title>Arrua DEV - Formulário</title>
</head>
<body>

    <nav class="menu">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="form.html">Formulário</a></li>
            <li><a href="about.html">Sobre</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Formulário de Cadastro</h2>

        <form action="formAction.html" method="GET" onsubmit="return validarFormulario()">

            <label>Nome:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>

            <label>Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label>Idade:</label><br>
            <input type="number" id="idade" name="idade" min="1" max="120" required><br><br>

            <label>Telefone:</label><br>
            <input type="text" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX" required><br><br>

            <button type="submit">Enviar</button>
        </form>
    </div>

</body>
</html>
