<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
    <link rel="icon" type="image/png" href="la.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Menu -->
  <nav class="menu">
    <ul>
      <li><a href="index.html">Página Inicial</a></li>
      <li><a href="form.html">Formulário</a></li>
      <li><a href="formAction.html">Resultados</a></li>
      <li><a href="about.html">Sobre</a></li>
    </ul>
  </nav>


  <main>
    <h1>Formulário</h1>

    <form action="formAction.html" method="GET" id="contactForm"> 
    
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" required>
    <span class="error-message" id="error-nome"></span>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <span class="error-message" id="error-email"></span>

    <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" name="telefone"
          placeholder="(11) 99999-9999"
          pattern="\(\d{2}\)\s?\d{4,5}-\d{4}"
          title="Formato esperado: (11) 99999-9999"
          required
          oninput="mascaraTelefone(this)"> 
    <span class="error-message" id="error-telefone"></span>
    
    <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" name="mensagem" required></textarea>
    <span class="error-message" id="error-mensagem"></span>

    <button type="submit">Enviar</button>
</form>

  </main>
  <!-- Rodapé -->
  <footer>
      <div id="rodape"></div>   
      <!-- Assinatura -->
        <p class="assinatura">
        Desenvolvido por <span class="nome-assinatura">Arrua</span> 🚀
      </p>
    </footer>
  </div>

  <script src="js/form.js"></script>
</body>
</html>
